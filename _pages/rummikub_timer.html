<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>拉密計時</title>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button, select {
      font-family: inherit;
    }

    /* ---------- Setup state ---------- */
    .setup {
      max-width: 400px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .setup h1 {
      text-align: center;
      font-size: 1.75rem;
      margin: 0 0 2rem;
      font-weight: 600;
    }

    .setup .field {
      margin-bottom: 1.75rem;
    }

    .setup .field-label {
      display: block;
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }

    .player-count-row {
      display: flex;
      gap: 0.5rem;
    }

    .player-count-btn {
      flex: 1;
      min-height: 48px;
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .player-count-btn.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }

    .time-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .time-row select {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-height: 48px;
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 1rem;
      padding: 0 0.75rem;
    }

    .time-row .time-unit {
      color: #8b949e;
      font-size: 0.95rem;
    }

    .color-preview {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .start-btn {
      display: block;
      width: 100%;
      min-height: 56px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
    }

    .start-btn:disabled {
      background: #30363d;
      color: #8b949e;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <section class="setup" id="setupView">
    <h1>拉密計時</h1>

    <div class="field">
      <label class="field-label">人數</label>
      <div class="player-count-row" id="playerCountRow">
        <button type="button" class="player-count-btn" data-count="2">2</button>
        <button type="button" class="player-count-btn" data-count="3">3</button>
        <button type="button" class="player-count-btn active" data-count="4">4</button>
        <button type="button" class="player-count-btn" data-count="5">5</button>
        <button type="button" class="player-count-btn" data-count="6">6</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label">每回合時間</label>
      <div class="time-row">
        <select id="minutesSelect">
          <option value="0">0</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <span class="time-unit">分</span>
        <select id="secondsSelect">
          <option value="0">0</option>
          <option value="15">15</option>
          <option value="30" selected>30</option>
          <option value="45">45</option>
        </select>
        <span class="time-unit">秒</span>
      </div>
    </div>

    <div class="field">
      <label class="field-label">玩家配色</label>
      <div class="color-preview" id="colorPreview"></div>
    </div>

    <button type="button" class="start-btn" id="startBtn">開始遊戲</button>
  </section>

  <script>
    // ---------- Constants ----------
    const COLORS = ['#8957e5', '#388bfd', '#3fb950', '#d29922', '#db6d28', '#f85149'];

    // ---------- State ----------
    const config = {
      playerCount: 4,
      turnSeconds: 90
    };

    // ---------- DOM refs ----------
    const playerCountRow = document.getElementById('playerCountRow');
    const colorPreview = document.getElementById('colorPreview');

    // ---------- Setup wiring ----------
    function renderColorPreview() {
      colorPreview.innerHTML = '';
      for (let i = 0; i < config.playerCount; i++) {
        const dot = document.createElement('div');
        dot.className = 'color-dot';
        dot.style.background = COLORS[i];
        colorPreview.appendChild(dot);
      }
    }

    function setPlayerCount(n) {
      config.playerCount = n;
      for (const btn of playerCountRow.querySelectorAll('.player-count-btn')) {
        btn.classList.toggle('active', Number(btn.dataset.count) === n);
      }
      renderColorPreview();
    }

    playerCountRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.player-count-btn');
      if (!btn) return;
      setPlayerCount(Number(btn.dataset.count));
    });

    // ---------- Init ----------
    renderColorPreview();
  </script>
</body>
</html>
