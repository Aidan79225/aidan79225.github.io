name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Cloudflare Web Analytics beacon token. Set as a repo Actions
          # *variable* (Settings → Secrets and variables → Actions → Variables).
          # Not a secret — it ships in client JS — but kept out of source.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://blog.aidan.tw/
    steps:
      # GitHub Pages custom-domain deploys intermittently return
      # "Deployment failed, try again later." (a backend/cert-provisioning
      # flake, not a build error) — so retry a couple of times before failing.
      - name: Deploy to GitHub Pages (attempt 1)
        id: a1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.a1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: a2
        if: steps.a1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final retry
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (final attempt)
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        uses: actions/deploy-pages@v4
